# Skrinshot UZ — Windows'da yig'ish, testlash va .exe chiqarish.
# Har push'da: build (ogohlantirishlarsiz) → unit testlar → win-x64 va win-x86 bitta .exe →
# tutun testi (.exe haqiqatan ishga tushadimi, xotira qancha) → o'rnatuvchi (Inno Setup) →
# o'rnatish / yangilash / o'chirish testi → Artifacts. "v1.0.0" kabi teg qo'yilsa — GitHub Release.
name: Build va test

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  # GitHub sahifasida "Draft a new release" → yangi teg (v1.2.3) → Publish — fayllar shu Release'ga yuklanadi.
  release:
    types: [ published ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build:
    name: Windows — build, test, .exe
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Kodni olish
        uses: actions/checkout@v5

      - name: .NET 8 SDK o'rnatish
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Versiyani aniqlash
        id: version
        run: |
          # Teg (v1.2.3) bo'lsa — aynan shu versiya; aks holda sinov yig'imi: 1.0.0-dev.<raqam>.
          $base = '1.0.0'
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $v = $env:GITHUB_REF_NAME.Substring(1)
            if ($v -notmatch '^\d+\.\d+\.\d+$') { throw "Teg formati v1.2.3 bo'lishi kerak: $env:GITHUB_REF_NAME" }
            $numeric = "$v.0"
          } else {
            $v = "$base-dev.$env:GITHUB_RUN_NUMBER"
            $numeric = "$base.$([math]::Min([int]$env:GITHUB_RUN_NUMBER, 65535))"
          }
          "value=$v" >> $env:GITHUB_OUTPUT
          "numeric=$numeric" >> $env:GITHUB_OUTPUT
          Write-Host "Versiya: $v ($numeric)"

      - name: Paketlarni tiklash
        run: dotnet restore SkrinshotUZ.sln

      - name: Build (ogohlantirishlarsiz)
        run: dotnet build SkrinshotUZ.sln -c Release --no-restore -warnaserror -p:Version=${{ steps.version.outputs.value }}

      - name: Unit testlar
        run: |
          # dotnet test xato kodi qaytarsa ham skript to'xtamasin — natijani o'zimiz tahlil qilamiz.
          $ErrorActionPreference = 'Continue'
          $PSNativeCommandUseErrorActionPreference = $false
          dotnet test SkrinshotUZ.sln -c Release --no-build `
            --logger "trx" `
            --logger "console;verbosity=normal" `
            --results-directory TestResults 2>&1 | Tee-Object -FilePath test-output.txt
          $testExit = $LASTEXITCODE

          # Test jarayoni yiqilsa (trx bo'lmasligi mumkin) — chiqishning oxirini annotatsiyaga chiqaramiz.
          if ($testExit -ne 0) {
            $tail = (Get-Content -LiteralPath test-output.txt | Where-Object { $_.Trim() } | Select-Object -Last 25) -join '%0A'
            Write-Host "::error title=dotnet test chiqishi (oxiri)::$tail"
          }

          # Natijani trx fayllardan (har bir test loyihasi alohida) o'qiymiz va annotatsiya sifatida chiqaramiz.
          $trxFiles = @(Get-ChildItem TestResults -Recurse -Filter *.trx)
          if ($trxFiles.Count -eq 0) { Write-Host "::error title=Unit testlar::trx fayl topilmadi (chiqish kodi $testExit)"; exit 1 }
          $parts = @()
          foreach ($trx in $trxFiles) {
            # -LiteralPath: fayl nomida [1] kabi belgilar bo'lishi mumkin (oddiy -Path ularni andoza deb tushunadi).
            [xml]$x = Get-Content -LiteralPath $trx.FullName -Raw
            $c = $x.TestRun.ResultSummary.Counters
            if (-not $c -or -not $c.total) { Write-Host "::error title=Unit testlar::$($trx.Name) o'qilmadi"; exit 1 }
            $dll = ($x.TestRun.TestDefinitions.UnitTest | Select-Object -First 1).storage
            $name = if ($dll) { [IO.Path]::GetFileNameWithoutExtension($dll) } else { $trx.BaseName }
            $parts += "$name — jami $($c.total), o'tdi $($c.passed), yiqildi $($c.failed)"
            foreach ($r in $x.TestRun.Results.UnitTestResult | Where-Object { $_.outcome -ne 'Passed' }) {
              $msg = ($r.Output.ErrorInfo.Message -replace '\r?\n', ' ').Trim()
              if ($msg.Length -gt 600) { $msg = $msg.Substring(0, 600) }
              Write-Host "::error title=Yiqilgan test::$($r.testName) — $msg"
            }
          }
          $ErrorActionPreference = 'Stop'
          $summary = $parts -join ' | '
          Write-Host "::notice title=Unit testlar::$summary"
          "**Unit testlar:** $summary" >> $env:GITHUB_STEP_SUMMARY
          exit $testExit

      - name: Test natijalarini saqlash
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-natijalari
          path: TestResults/**/*.trx
          if-no-files-found: warn

      - name: Bitta .exe yig'ish (win-x64 va win-x86)
        run: |
          foreach ($rid in 'win-x64', 'win-x86') {
            dotnet publish src/SkrinshotUZ/SkrinshotUZ.csproj -c Release -r $rid --self-contained true `
              -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true `
              -p:Version=${{ steps.version.outputs.value }} -o "publish/$rid"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

            $exe = "publish/$rid/SkrinshotUZ.exe"
            if (-not (Test-Path $exe)) { throw "${rid}: $exe topilmadi" }

            # Talab: natija — faqat bitta .exe.
            $other = Get-ChildItem "publish/$rid" -File | Where-Object { $_.Name -ne 'SkrinshotUZ.exe' }
            if ($other) { throw "${rid}: .exe yonida qo'shimcha fayllar bor: $($other.Name -join ', ')" }

            $mb = [math]::Round((Get-Item $exe).Length / 1MB, 1)
            Write-Host "::notice title=${rid} .exe hajmi::SkrinshotUZ.exe — $mb MB"
            "- **${rid}**: SkrinshotUZ.exe — $mb MB" >> $env:GITHUB_STEP_SUMMARY
          }

      - name: Tutun testi (.exe ishga tushadimi, xotira < 40 MB)
        run: |
          foreach ($rid in 'win-x64', 'win-x86') {
            $report = Join-Path $env:RUNNER_TEMP "smoke-$rid.txt"
            $p = Start-Process "publish/$rid/SkrinshotUZ.exe" -ArgumentList '--smoke-test', '--smoke-report', "`"$report`"" -PassThru
            $null = $p.Handle   # aks holda PowerShell ExitCode'ni yo'qotadi
            if (-not $p.WaitForExit(90000)) { $p.Kill(); throw "${rid}: dastur 90 soniyada yopilmadi" }
            if ($p.ExitCode -ne 0) {
              if (Test-Path $report) { Get-Content $report | Write-Host }
              throw "${rid}: chiqish kodi $($p.ExitCode)"
            }
            if (-not (Test-Path $report)) { throw "${rid}: hisobot fayli yozilmadi" }

            $text = Get-Content $report -Raw
            Write-Host "--- ${rid} ---"
            Write-Host $text
            if ($text -notmatch 'status=ok') { throw "${rid}: status=ok emas" }

            # Tugmalar boshqaruvi haqiqiy Windows'da ishga tushganini tasdiqlash (4 ta birikma hisobotda bo'lishi shart).
            $hotkeys = [regex]::Matches($text, '(?m)^hotkey\.(.+)=(\w+)\r?$')
            if ($hotkeys.Count -ne 4) { throw "${rid}: 4 ta tugma holati kutilgan, topildi: $($hotkeys.Count)" }

            function Get-Mb($name) { [double]::Parse(([regex]::Match($text, "$name=([\d.]+)")).Groups[1].Value, [cultureinfo]::InvariantCulture) }
            $ws = Get-Mb 'workingSetMB'
            $priv = Get-Mb 'privateMB'
            $peak = Get-Mb 'peakWorkingSetMB'
            $keys = ($hotkeys | ForEach-Object { "$($_.Groups[1].Value)=$($_.Groups[2].Value)" }) -join ', '

            Write-Host "::notice title=${rid} xotira::ishchi xotira $ws MB, shaxsiy $priv MB, eng yuqori $peak MB"
            Write-Host "::notice title=${rid} tugmalar::$keys"

            # To'liq skrinshot yo'li: ekran → overlay → soha → bufer.
            $capture = ([regex]::Match($text, '(?m)^capture=(.*?)\r?$')).Groups[1].Value
            if ($capture -like 'ok*') { Write-Host "::notice title=${rid} skrinshot yo'li::$capture" }
            else { throw "${rid}: skrinshot yo'li ishlamadi — $capture" }
            # Saqlash yo'li: PNG + JPG faylga yozish, qayta o'qish, tarix oynasi.
            $save = ([regex]::Match($text, '(?m)^save=(.*?)\r?$')).Groups[1].Value
            if ($save -like 'ok*') { Write-Host "::notice title=${rid} saqlash::$save" }
            else { throw "${rid}: saqlash ishlamadi — $save" }
            # Chop etish: oyna, reja va "Microsoft Print to PDF" orqali haqiqiy PDF.
            $print = ([regex]::Match($text, '(?m)^print=(.*?)\r?$')).Groups[1].Value
            if ($print -like 'ok*') {
              Write-Host "::notice title=${rid} chop etish::$print"
              if ($print -like '*pdf=skip*') { Write-Host "::warning::${rid}: PDF printer yo'q — PDF tekshirilmadi" }
            }
            else { throw "${rid}: chop etish ishlamadi — $print" }
            "- **${rid}** tutun testi o'tdi — ishchi xotira: $ws MB, shaxsiy: $priv MB, eng yuqori: $peak MB; tugmalar: $keys" >> $env:GITHUB_STEP_SUMMARY
            if ($ws -ge 40) { Write-Host "::warning::${rid}: xotira $ws MB (maqsad < 40 MB)" }
          }

      - name: Panellar rasmi (ko'rib chiqish uchun, annotatsiyalarda)
        run: |
          $report = Join-Path $env:RUNNER_TEMP "smoke-win-x64.txt"
          $line = (Get-Content -LiteralPath $report | Where-Object { $_ -like 'toolbars=*' } | Select-Object -First 1)
          if (-not $line) { Write-Host "::warning::panellar rasmi topilmadi"; exit 0 }
          $parts = $line.Substring(9) -split ' png=', 2
          Write-Host "::notice title=panel-info::$($parts[0])"
          if ($parts.Count -lt 2) { exit 0 }
          $b64 = $parts[1]
          $size = 4000   # GitHub annotatsiya matnini 4096 belgida kesadi
          $n = [math]::Ceiling($b64.Length / $size)
          if ($n -gt 9) { Write-Host "::warning::panel rasmi juda katta ($($b64.Length) belgi)"; exit 0 }
          for ($i = 0; $i -lt $n; $i++) {
            $chunk = $b64.Substring($i * $size, [math]::Min($size, $b64.Length - $i * $size))
            Write-Host "::notice title=panel-png $($i + 1)/$n::$chunk"
          }

      - name: Tarix oynasi rasmi (ko'rib chiqish uchun)
        run: |
          $report = Join-Path $env:RUNNER_TEMP "smoke-win-x64.txt"
          $line = (Get-Content -LiteralPath $report | Where-Object { $_ -like 'history=*' } | Select-Object -First 1)
          if (-not $line) { Write-Host "::warning::tarix rasmi topilmadi"; exit 0 }
          $parts = $line.Substring(8) -split ' png=', 2
          Write-Host "::notice title=tarix-info::$($parts[0])"
          if ($parts.Count -lt 2) { exit 0 }
          $b64 = $parts[1]
          $size = 4000   # GitHub annotatsiya matnini 4096 belgida kesadi
          $n = [math]::Ceiling($b64.Length / $size)
          if ($n -gt 9) { Write-Host "::warning::tarix rasmi juda katta ($($b64.Length) belgi)"; exit 0 }
          for ($i = 0; $i -lt $n; $i++) {
            $chunk = $b64.Substring($i * $size, [math]::Min($size, $b64.Length - $i * $size))
            Write-Host "::notice title=tarix-png $($i + 1)/$n::$chunk"
          }

      - name: Chop etish oynasi rasmi (ko'rib chiqish uchun)
        run: |
          $report = Join-Path $env:RUNNER_TEMP "smoke-win-x64.txt"
          $line = (Get-Content -LiteralPath $report | Where-Object { $_ -like 'printview=*' } | Select-Object -First 1)
          if (-not $line) { Write-Host "::warning::chop etish rasmi topilmadi"; exit 0 }
          $parts = $line.Substring(10) -split ' png=', 2
          Write-Host "::notice title=chop-info::$($parts[0])"
          if ($parts.Count -lt 2) { exit 0 }
          $b64 = $parts[1]
          $size = 4000   # GitHub annotatsiya matnini 4096 belgida kesadi
          $n = [math]::Ceiling($b64.Length / $size)
          if ($n -gt 9) { Write-Host "::warning::chop etish rasmi juda katta ($($b64.Length) belgi)"; exit 0 }
          for ($i = 0; $i -lt $n; $i++) {
            $chunk = $b64.Substring($i * $size, [math]::Min($size, $b64.Length - $i * $size))
            Write-Host "::notice title=chop-png $($i + 1)/$n::$chunk"
          }

      - name: O'rnatuvchini yig'ish (Inno Setup)
        id: setup
        run: |
          function Find-Iscc { @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1 }
          function Inno-Version {
            # ISCC.exe'ning o'z versiya ma'lumoti bo'sh (0.0.0.0) — versiya o'rnatuvchi yozuvidan olinadi.
            $keys = 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\Inno Setup 6_is1',
                    'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\Inno Setup 6_is1'
            foreach ($k in $keys) { $v = (Get-ItemProperty $k -ErrorAction SilentlyContinue).DisplayVersion; if ($v) { return [version]($v -replace '[^\d\.].*$','') } }
            return [version]'0.0'
          }
          $iscc = Find-Iscc
          if (-not $iscc -or (Inno-Version) -lt [version]'6.5') {
            Write-Host "Inno Setup 6.5+ o'rnatilmoqda (hozirgi: $(Inno-Version))"
            choco upgrade innosetup -y --no-progress | Out-Null
            $iscc = Find-Iscc
          }
          if (-not $iscc) { throw "Inno Setup (ISCC.exe) topilmadi" }
          $innoDir = Split-Path $iscc
          $innoVersion = Inno-Version
          Write-Host "::notice title=Inno Setup::$innoVersion ($iscc)"
          if ($innoVersion -lt [version]'6.5') { throw "Inno Setup 6.5+ kerak, topildi: $innoVersion" }

          # O'zbekcha tarjima o'rnatilgan Inno versiyasining Default.isl'iga to'liq mosmi.
          python installer/check-isl.py "$innoDir\Default.isl" installer/Uzbek.isl
          if ($LASTEXITCODE -ne 0) { throw "Uzbek.isl tarjimasida xato bor" }

          $root = (Get-Location).Path
          $ErrorActionPreference = 'Continue'
          $PSNativeCommandUseErrorActionPreference = $false
          & $iscc `
            "/DAppVersion=${{ steps.version.outputs.value }}" `
            "/DAppNumericVersion=${{ steps.version.outputs.numeric }}" `
            "/DSourceX64=$root\publish\win-x64" `
            "/DSourceX86=$root\publish\win-x86" `
            "/DOutputDir=$root\publish\setup" `
            installer\SkrinshotUZ.iss 2>&1 | Tee-Object -FilePath iscc-output.txt
          $code = $LASTEXITCODE
          $ErrorActionPreference = 'Stop'
          $warnings = @(Get-Content iscc-output.txt | Where-Object { $_ -match '^\s*Warning' })
          foreach ($w in $warnings) { Write-Host "::error title=Inno Setup ogohlantirishi::$w" }
          if ($code -ne 0) { throw "ISCC xato bilan tugadi ($code)" }
          if ($warnings.Count -gt 0) { throw "Inno Setup ogohlantirishlari bor (talab: ogohlantirishsiz)" }

          $setup = "publish/setup/SkrinshotUZ_Setup.exe"
          if (-not (Test-Path $setup)) { throw "$setup topilmadi" }
          $mb = [math]::Round((Get-Item $setup).Length / 1MB, 1)
          Write-Host "::notice title=SkrinshotUZ_Setup.exe::$mb MB (x64 + x86)"
          "- **SkrinshotUZ_Setup.exe**: $mb MB" >> $env:GITHUB_STEP_SUMMARY

      - name: O'rnatish / yangilash / o'chirish testi
        run: |
          # Har qanday xato matni annotatsiyaga chiqsin (loglarni ochmasdan ham ko'rinsin).
          trap { Write-Host "::error title=O'rnatuvchi testi::$($_.Exception.Message) (qator $($_.InvocationInfo.ScriptLineNumber))"; Get-ChildItem $env:RUNNER_TEMP -Filter 'install*.log' | ForEach-Object { $t = (Get-Content $_.FullName | Select-Object -Last 15) -join '%0A'; Write-Host "::error title=$($_.Name)::$t" }; exit 1 }
          $setup = (Resolve-Path "publish/setup/SkrinshotUZ_Setup.exe").Path
          $dir = Join-Path $env:LOCALAPPDATA "Programs\Skrinshot UZ"
          $exe = Join-Path $dir "SkrinshotUZ.exe"
          $appData = Join-Path $env:APPDATA "Skrinshot UZ"
          $startMenu = Join-Path ([Environment]::GetFolderPath('Programs')) "Skrinshot UZ.lnk"
          $desktop = Join-Path ([Environment]::GetFolderPath('Desktop')) "Skrinshot UZ.lnk"
          $uninstKey = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\{45B6F012-9A70-43A6-901D-74D221DC5E30}_is1'
          $runKey = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run'
          $pictures = Join-Path ([Environment]::GetFolderPath('MyPictures')) "Skrinshot UZ"

          function Install([string]$log) {
            $p = Start-Process $setup -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/CURRENTUSER', "/LOG=`"$log`"" -PassThru -Wait
            if ($p.ExitCode -ne 0) { Get-Content $log -ErrorAction SilentlyContinue | Select-Object -Last 30 | Write-Host; throw "o'rnatuvchi chiqish kodi $($p.ExitCode)" }
          }
          function Machine([string]$file) {
            $b = [IO.File]::ReadAllBytes($file); $pe = [BitConverter]::ToInt32($b, 0x3C)
            return '{0:X4}' -f [BitConverter]::ToUInt16($b, $pe + 4)
          }

          # 1) Toza o'rnatish (administrator huquqisiz, faqat joriy foydalanuvchi uchun).
          Install (Join-Path $env:RUNNER_TEMP 'install1.log')
          foreach ($f in $exe, $startMenu, $desktop) { if (-not (Test-Path $f)) { throw "o'rnatilmadi: $f" } }
          if ((Machine $exe) -ne '8664') { throw "64-bit Windows'ga 64-bit .exe o'rnatilishi kerak edi (topildi: $(Machine $exe))" }
          $reg = Get-ItemProperty $uninstKey
          if ($reg.DisplayName -ne 'Skrinshot UZ' -or $reg.DisplayVersion -ne '${{ steps.version.outputs.value }}') { throw "Dasturlar ro'yxatidagi yozuv noto'g'ri: $($reg.DisplayName) $($reg.DisplayVersion)" }
          if (Test-Path $appData) { throw "o'rnatuvchi sozlamalar yaratmasligi kerak (ruxsatlar dasturda so'raladi)" }
          if ((Get-ItemProperty $runKey -ErrorAction SilentlyContinue).'Skrinshot UZ') { throw "o'rnatuvchi avtoishga tushirishni o'zi yoqmasligi kerak" }
          Write-Host "::notice title=O'rnatish::$dir (x64), Boshlash menyusi va ish stoli yorliqlari, Dasturlar ro'yxatida ${{ steps.version.outputs.value }}"

          # 2) O'rnatilgan .exe ishlaydimi (tutun testi).
          $report = Join-Path $env:RUNNER_TEMP 'smoke-installed.txt'
          $p = Start-Process $exe -ArgumentList '--smoke-test', '--smoke-report', "`"$report`"" -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "o'rnatilgan .exe tutun testi: chiqish kodi $($p.ExitCode)" }

          # 3) Yangilash dastur ishlab turganda: o'rnatuvchi uni o'zi yopishi kerak (--exit).
          #    Foydalanuvchi ruxsatlarga avval javob bergan holat; avtoishga tushirish yoqilgan.
          New-Item -ItemType Directory -Force $appData | Out-Null
          '{ "PrintScreenConsent": "Allowed", "SnippingToolPromptAnswered": true }' | Set-Content (Join-Path $appData 'settings.json') -Encoding utf8
          Set-ItemProperty $runKey -Name 'Skrinshot UZ' -Value "`"$exe`" --autostart"
          $running = Start-Process $exe -PassThru
          Start-Sleep -Seconds 4
          if ($running.HasExited) { throw "dastur ishga tushmadi (chiqish kodi $($running.ExitCode))" }
          $before = (Get-Item $exe).LastWriteTimeUtc
          Install (Join-Path $env:RUNNER_TEMP 'install2.log')
          if (-not $running.WaitForExit(5000)) { $running.Kill(); throw "yangilashda ishlab turgan dastur yopilmadi" }
          if (-not (Test-Path $exe)) { throw "yangilashdan keyin .exe yo'q" }
          Write-Host "::notice title=Yangilash::ishlab turgan dastur avtomatik yopildi, fayl almashtirildi"

          # 4) O'chirish (jim): fayllar, yorliqlar, ro'yxat yozuvi, avtoishga tushirish, sozlamalar o'chadi;
          #    skrinshotlar QOLADI.
          New-Item -ItemType Directory -Force $pictures | Out-Null
          $keep = Join-Path $pictures 'skrinshot_ci_test.png'
          Set-Content $keep 'test'
          $running = Start-Process $exe -PassThru
          Start-Sleep -Seconds 3
          $uninst = Join-Path $dir 'unins000.exe'
          Start-Process $uninst -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait
          # unins000.exe o'zini vaqtinchalik papkaga nusxalab ishlaydi — natijani kutamiz.
          for ($i = 0; $i -lt 60 -and (Test-Path $exe); $i++) { Start-Sleep -Seconds 1 }
          if (-not $running.WaitForExit(5000)) { $running.Kill(); throw "o'chirishda ishlab turgan dastur yopilmadi" }
          foreach ($f in $exe, $startMenu, $desktop, $appData) { if (Test-Path $f) { throw "o'chirilmadi: $f" } }
          if (Test-Path $uninstKey) { throw "Dasturlar ro'yxatidagi yozuv qoldi" }
          if ((Get-ItemProperty $runKey -ErrorAction SilentlyContinue).'Skrinshot UZ') { throw "avtoishga tushirish yozuvi qoldi" }
          if (-not (Test-Path $keep)) { throw "skrinshotlar o'chirib yuborildi!" }
          Remove-Item $pictures -Recurse -Force
          Write-Host "::notice title=O'chirish::fayllar, yorliqlar, avtoishga tushirish va sozlamalar o'chirildi; skrinshotlar saqlanib qoldi"
          "- **O'rnatuvchi testi**: o'rnatish, ishlab turgan dasturni yangilash, o'chirish — o'tdi" >> $env:GITHUB_STEP_SUMMARY

      - name: SkrinshotUZ_Setup.exe ni Artifacts'ga qo'yish
        uses: actions/upload-artifact@v6
        with:
          name: SkrinshotUZ_Setup-${{ steps.version.outputs.value }}
          path: publish/setup/SkrinshotUZ_Setup.exe
          if-no-files-found: error

      - name: SkrinshotUZ.exe (64-bit) ni Artifacts'ga qo'yish
        uses: actions/upload-artifact@v6
        with:
          name: SkrinshotUZ-${{ steps.version.outputs.value }}-win-x64
          path: publish/win-x64/SkrinshotUZ.exe
          if-no-files-found: error

      - name: SkrinshotUZ.exe (32-bit) ni Artifacts'ga qo'yish
        uses: actions/upload-artifact@v6
        with:
          name: SkrinshotUZ-${{ steps.version.outputs.value }}-win-x86
          path: publish/win-x86/SkrinshotUZ.exe
          if-no-files-found: error

  release:
    name: GitHub Release (faqat v* teglarida)
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Artifacts'ni olish
        uses: actions/download-artifact@v7
        with:
          path: dist

      - name: Release yaratish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          ver="${tag#v}"
          mkdir -p out
          # Fayl nomlari o'zgarmas — shunda .../releases/latest/download/SkrinshotUZ_Setup.exe havolasi
          # har doim eng yangi versiyani beradi (saytga bir marta qo'yiladigan doimiy havola).
          cp "dist/SkrinshotUZ_Setup-${ver}/SkrinshotUZ_Setup.exe" "out/SkrinshotUZ_Setup.exe"
          cp "dist/SkrinshotUZ-${ver}-win-x64/SkrinshotUZ.exe" "out/SkrinshotUZ-x64.exe"
          cp "dist/SkrinshotUZ-${ver}-win-x86/SkrinshotUZ.exe" "out/SkrinshotUZ-x86.exe"
          (cd out && sha256sum *.exe > SHA256SUMS.txt)
          cat > notes.md <<NOTES
          ## Skrinshot UZ ${ver}

          **Qaysi faylni yuklab olish kerak?**
          - \`SkrinshotUZ_Setup.exe\` — o'rnatuvchi (tavsiya etiladi). 64-bit va 32-bit Windows 10/11 uchun, administrator huquqi shart emas.
          - \`SkrinshotUZ-x64.exe\` / \`SkrinshotUZ-x86.exe\` — o'rnatmasdan ishlaydigan bitta fayl (fleshkadan ham).

          Windows "kompyuteringizni himoya qildi" desa: "Batafsil" → "Baribir ishga tushirish" (dastur raqamli imzosiz).

          Dastur to'liq oflayn ishlaydi: hech qanday rasm internetga yuborilmaydi.
          Fayllar butunligini tekshirish: \`SHA256SUMS.txt\`.
          NOTES
          # Release GitHub sahifasida qo'lda yaratilgan bo'lishi ham mumkin — unda fayllar unga qo'shiladi.
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$tag" out/* --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --title "Skrinshot UZ ${ver}" --notes-file notes.md
          else
            gh release create "$tag" out/* --repo "$GITHUB_REPOSITORY" --title "Skrinshot UZ ${ver}" --notes-file notes.md
          fi
